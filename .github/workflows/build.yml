name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0

      # Generate the wrapper jar (not committed; network-restricted locally).
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.5.0

      # Builds the active node (1.21.1) across its enabled loaders.
      - name: Build
        run: ./gradlew build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumentech-jars
          path: '**/build/libs/*.jar'
          if-no-files-found: warn
