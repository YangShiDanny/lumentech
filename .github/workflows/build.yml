# ==============================================================
# LumenTech Mod Build Workflow
# Stonecutter Multi-loader
# Features:
# 1. Parallel build matrix, single fail won't block pipeline
# 2. Collect all logs & jars into one tar artifact
# 3. GITHUB_STEP_SUMMARY report: success/fail list + artifact guide
# 4. Release only when ALL matrix build success
# ==============================================================
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma split mc versions, empty for all'
        required: false
        default: ''
      loaders:
        description: 'Comma split loaders, empty for all'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.disco.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate matrix
        id: disco
        run: python3 scripts/build-matrix.py ${{ github.event.inputs.versions }} ${{ github.event.inputs.loaders }}

  build:
    needs: discover
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    name: ${{ matrix.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (for 1.20.1 Fabric)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare log dir
        run: mkdir -p build_logs

      - name: Gradle Build ${{ matrix.node }}
        run: |
          echo "::group::Gradle Build ${{ matrix.node }}"
          ./gradlew --console=plain --no-daemon \
            -Pmultiloader.target.versions=${{ matrix.version }} \
            -Pmultiloader.target.loaders=${{ matrix.loader }} \
            ${{ matrix.task }} 2>&1 | tee build_logs/${{ matrix.node }}.log
          echo "::endgroup::"
        env:
          GRADLE_SCAN_UPLOAD: true

      - name: Export job status
        id: status
        run: |
          if [[ $? -eq 0 ]]; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.node }}
          path: build_logs/${{ matrix.node }}.log
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.node }}
          path: |
            versions/${{ matrix.version }}/${{ matrix.loader }}/build/libs/*.jar
            ${{ matrix.loader }}/versions/${{ matrix.version }}/build/libs/*.jar
            ${{ matrix.loader }}/build/libs/*.jar
          retention-days: 7

  merge-artifacts:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all logs and jars
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Pack all to tar.gz
        run: |
          tar -czf all-build-results.tar.gz ./artifacts

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: all-build-results
          path: all-build-results.tar.gz
          retention-days: 7

      - name: Step summary
        run: |
          echo "# 📦 Merge Artifact Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Combined artifact: \`all-build-results.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- Contains: all independent logs + jars" >> $GITHUB_STEP_SUMMARY

  release:
    needs: [build, merge-artifacts]
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      && !contains(needs.build.results, 'failure')
    steps:
      - name: Checkout 获取git仓库，用于读取commit hash
        uses: actions/checkout@v4

      - name: Download all jar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*    # ✅ 修正：匹配 jar-xxx 而不是 lumentech-*
          merge-multiple: true
          path: release_jars

      # 【关键调试步骤】打印目录结构，看文件在哪，上线稳定后可以删掉
      - name: List downloaded jars
        run: ls -R release_jars

      - name: Generate release tag name
        id: taggen
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="nightly-${SHORT_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=LumenTech Nightly Build $TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.taggen.outputs.tag }}
          name: ${{ steps.taggen.outputs.name }}
          generate_release_notes: true
          prerelease: true
          files: release_jars/**/*.jar # ✅ ** 递归所有子文件夹找jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  report:
    needs: [merge-artifacts, release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build full report summary
        run: |
          echo "# 📋 LumenTech Build Report" >> $GITHUB_STEP_SUMMARY
          echo "Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit SHA: [${{ github.sha }}](${{ github.event.commit.url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📄 Log Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Individual log: \`log-<node>\`" >> $GITHUB_STEP_SUMMARY
          echo "- Full pack: \`all-build-results.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🫙 Jar Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Individual jar: \`jar-<node>\`" >> $GITHUB_STEP_SUMMARY
          echo "- Full pack: \`all-build-results.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🚀 Release Status" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.release.result }}" == "success" ]]; then
            echo "- ✅ Nightly Release published" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Nightly Release skipped (has failed build)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Go to the bottom of this page, Artifacts section to download files." >> $GITHUB_STEP_SUMMARY
