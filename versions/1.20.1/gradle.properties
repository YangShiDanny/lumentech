project.version=1.0.0+1.20.1
project.java=17
project.build-java=21
project.minecraft=1.20.1
# Forge is dropped on 1.20.1 for now: the Konfig build the plugin resolves for it
# (0.10.2+1.20.1, forge) is packaged empty — 14 files, zero .class entries, only
# assets + mods.toml. Compiling against it fails with "package com.iamkaf.konfig.api.v1
# does not exist", and it would be equally unusable at runtime. The previous release
# (0.10.1+1.20.1, forge) does contain the API, so re-add `forge` here once the 0.10.2
# forge artifact is republished (or pin the dependency to 0.10.1).
project.enabled-loaders=fabric

# Reborn Energy (TechReborn energy API): 3.x covers 1.19.4 -> 1.20.4
energy.version=3.0.0
# GeckoLib for 1.20.1 (needed by the Signal Receiver's animated model)
geckolib.version=4.8.4

mod.minecraft-range=[1.20.1, 1.21)
mod.fabric-range=>=1.20.1
mod.forge-loader-range=[47,)

mixin.compat.common=JAVA_17
mixin.compat.fabric=JAVA_17
mixin.compat.forge=JAVA_17
