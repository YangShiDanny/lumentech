project.version=1.0.0+26.2
project.java=21
project.build-java=21
project.minecraft=26.2
project.enabled-loaders=fabric,neoforge

# GeckoLib 5.x and Reborn Energy are intentionally NOT wired on the 26.x lines yet.
# GeckoLib 5.x changed its Maven group to `com.geckolib` and is a different API, so the
# Signal Receiver's animated model needs a separate port (the 1.x code targets 4.x).
# Reborn Energy is gated out for the same reason, keeping 26.x a feature-free core mod
# (blocks/items/config register, but no animation or energy) — matching neoforge.
# When porting, add `geckolib.version` (e.g. 5.5.5) and `energy.version` here.

mod.minecraft-range=[26.2, 27)
mod.fabric-range=>=26.2
mod.neoforge-loader-range=[1,)

mixin.compat.common=JAVA_21
mixin.compat.fabric=JAVA_21
mixin.compat.neoforge=JAVA_21
